<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Kardio"><meta name="theme-color" content="#0A0E1A"><title>Kardio Plan</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="ikona.png"><link rel="icon" type="image/png" href="ikona-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}</style></head><body><style>
/* Raspored: jedna kolona telefona (do 480 px), sticky zaglavlje sekcije, donja traka sa 5 tabova, listovi (sheet) odozdo i tajmer preko celog ekrana.
   Boje: zone pulsa Z1–Z5 su sistem boja aplikacije; ruža (accent) je puls, narandžasta (accent2) napor, cijan (cool) odmor. */
:root {
  --bg: #0A0E1A; --bg2: #0F1526; --card: #141B2F; --card2: #1B2440; --line: rgba(148,168,224,.13); --track: rgba(148,168,224,.16);
  --fg: #EEF1FA; --fg2: #A7B0CB; --fg3: #6F7893;
  --accent: #FF3D71; --accent2: #FF8A3D; --cool: #3BCFEA; --good: #34D399; --bad: #F87171;
  --z1: #5B9DF9; --z2: #2DD4B0; --z3: #F5C443; --z4: #FF8A3D; --z5: #FF3D71;
  --shadow: 0 12px 32px rgba(0,0,0,.38); --glass: rgba(10,14,26,.78);
  --f-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body: 'Onest', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --r: 20px; --r-sm: 13px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F2F4FA; --bg2: #E8ECF6; --card: #FFFFFF; --card2: #F1F4FB; --line: rgba(22,32,72,.10); --track: rgba(22,32,72,.09);
    --fg: #0E1430; --fg2: #49547A; --fg3: #8690AF;
    --accent: #E5174F; --accent2: #EF6A12; --cool: #0596B8; --good: #0E9F6E; --bad: #DC2626;
    --z1: #2F7BEA; --z2: #0FA88A; --z3: #C99400; --z4: #EF6A12; --z5: #E5174F;
    --shadow: 0 10px 28px rgba(20,30,70,.10); --glass: rgba(242,244,250,.82);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F2F4FA; --bg2: #E8ECF6; --card: #FFFFFF; --card2: #F1F4FB; --line: rgba(22,32,72,.10); --track: rgba(22,32,72,.09);
  --fg: #0E1430; --fg2: #49547A; --fg3: #8690AF;
  --accent: #E5174F; --accent2: #EF6A12; --cool: #0596B8; --good: #0E9F6E; --bad: #DC2626;
  --z1: #2F7BEA; --z2: #0FA88A; --z3: #C99400; --z4: #EF6A12; --z5: #E5174F;
  --shadow: 0 10px 28px rgba(20,30,70,.10); --glass: rgba(242,244,250,.82);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, input:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; border-radius: 10px; }
input, textarea { font: inherit; color: var(--fg); }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg2); }
.small { font-size: 13px; }
p { margin: 0; }

.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); }
#main { display: flex; flex-direction: column; gap: 14px; }

/* tipografija */
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--fg3); }
.h1 { font: 700 26px/1.15 var(--f-display); letter-spacing: -.01em; margin: 2px 0 0; text-wrap: balance; }
.h2 { font: 700 19px/1.25 var(--f-display); margin: 4px 0 0; text-wrap: balance; }
.h3 { font: 600 15px/1.3 var(--f-body); margin: 0; display: flex; align-items: center; gap: 8px; }
.h3 .ic { width: 18px; height: 18px; color: var(--accent); }
.sub { color: var(--fg2); font-weight: 500; }
.big { font: 700 28px/1.1 var(--f-display); }
.big small { font: 500 14px var(--f-body); color: var(--fg2); }

/* zaglavlje */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 10px; }
.avatar { position: relative; width: 44px; height: 44px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; color: var(--fg2); }
.avatar i { position: absolute; right: 1px; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--bg); background: var(--fg3); }
.avatar i[data-s="ok"] { background: var(--good); }
.avatar i[data-s="err"], .avatar i[data-s="full"] { background: var(--z3); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card.flat { box-shadow: none; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.link { color: var(--accent); font-weight: 600; font-size: 14px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: var(--card2); color: var(--fg2); font-size: 13.5px; }
.note .ic { color: var(--cool); width: 18px; height: 18px; margin-top: 1px; }

.setup { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r); background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 18%, var(--card)), var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.setup > span { width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.setup div { flex: 1; min-width: 0; }
.setup p { font-size: 13px; color: var(--fg2); }
.setup > .ic { color: var(--fg3); }

/* hero / prsten */
.hero { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%), var(--card); }
.hero-top { display: flex; align-items: center; gap: 16px; }
.ringwrap { position: relative; flex: none; display: grid; place-items: center; }
.ringwrap .ring { display: block; }
.ringlabel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ringlabel b { font: 800 30px/1 var(--f-display); }
.ringlabel span { font-size: 11px; color: var(--fg2); max-width: 80px; line-height: 1.25; margin-top: 4px; }
.ringwrap.sm .ringlabel b { font-size: 20px; }
.hero-meta { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.phase { font-weight: 600; font-size: 14px; }
.streak { display: inline-flex; align-items: baseline; gap: 6px; margin-top: 6px; padding: 8px 12px; border-radius: 14px; background: color-mix(in srgb, var(--accent2) 14%, transparent); align-self: flex-start; }
.streak .ic { width: 18px; height: 18px; color: var(--accent2); align-self: center; }
.streak b { font: 800 20px/1 var(--f-display); color: var(--accent2); }
.streak span { font-size: 12.5px; color: var(--fg2); }
.ecg { width: 100%; height: 30px; display: block; }
.ecg path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-dasharray: 420; stroke-dashoffset: 0; opacity: .8; }
@media (prefers-reduced-motion: no-preference) { .ecg path { animation: ecg 3.2s linear infinite; } }
@keyframes ecg { 0% { stroke-dashoffset: 420; } 70%, 100% { stroke-dashoffset: 0; } }

.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.chk { position: relative; width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-radius: 12px; overflow: hidden; }
.chk .box, .shop .box { width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--track); display: grid; place-items: center; flex: none; color: transparent; transition: .15s; }
.chk .box .ic, .shop .box .ic { width: 16px; height: 16px; stroke-width: 3; }
.chk.done .box, .shop .got .box { background: var(--good); border-color: var(--good); color: #fff; }
.chk .cn { flex: 1; font-weight: 500; min-width: 0; }
.chk.done .cn { color: var(--fg2); }
.chk .cv { font-size: 13px; color: var(--fg2); text-align: right; }
.chk .mini { position: absolute; left: 42px; right: 4px; bottom: 3px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--cool) var(--p), var(--track) var(--p)); }

/* kartica treninga */
.wcard { border-left: 0; background: linear-gradient(160deg, color-mix(in srgb, var(--c, var(--z1)) 16%, var(--card)) 0%, var(--card) 55%); }
.wtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.tchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: .03em; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); white-space: nowrap; }
.tchip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.wblocks { display: flex; flex-wrap: wrap; gap: 6px; }
.wblocks span { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; background: var(--card2); color: var(--fg2); }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; }
.row2 > * { flex: 1 1 140px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px; border-radius: 15px; font-weight: 700; font-size: 15.5px; text-align: center; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.primary .ic { width: 18px; height: 18px; }
.btn.ghost { background: var(--card2); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); margin-top: 6px; }
.btn.sm { min-height: 44px; font-size: 14.5px; }
.btn.big { width: 100%; min-height: 58px; font-size: 17px; }
.btn:active { transform: scale(.98); }
.donebar { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); font-weight: 600; }
.bul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--fg2); }
.bul li::marker { color: var(--accent); }

/* voda */
.glasses { display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); gap: 6px; }
.glass { display: grid; place-items: center; padding: 4px 0; }
.glass svg { width: 24px; height: 30px; }
.glass .gl { fill: none; stroke: var(--track); stroke-width: 1.8; }
.glass .wt { fill: transparent; transition: fill .2s; }
.glass.full .gl { stroke: var(--cool); }
.glass.full .wt { fill: var(--cool); }

/* obroci danas */
.meals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.meal { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.meal:last-child { border-bottom: 0; }
.mchk { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--track); display: grid; place-items: center; color: transparent; flex: none; }
.mchk .ic { width: 15px; height: 15px; stroke-width: 3; }
.meal.eaten .mchk { background: var(--good); border-color: var(--good); color: #fff; }
.mbody { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mt { font-size: 12px; color: var(--fg3); font-weight: 600; }
.mn { font-weight: 500; line-height: 1.3; }
.meal.eaten .mn { color: var(--fg2); text-decoration: line-through; text-decoration-color: var(--fg3); }
.mk { font-size: 13px; color: var(--fg2); }
.mk::after { content: ' kcal'; color: var(--fg3); font-size: 11px; }
.foot { font-size: 13px; }
.quote { margin: 4px 0 0; padding: 18px 4px 6px; font: 500 17px/1.4 var(--f-display); color: var(--fg2); text-align: left; text-wrap: balance; }
.quote::before { content: '„'; color: var(--accent); }
.quote::after { content: '”'; color: var(--accent); }

/* segmentirana kontrola, čipovi, pretraga */
.seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; text-align: center; padding: 9px 6px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--fg2); }
.seg button[aria-selected="true"] { background: var(--card2); color: var(--fg); box-shadow: 0 1px 0 var(--line), 0 4px 12px rgba(0,0,0,.12); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-block: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 13.5px; font-weight: 600; color: var(--fg2); white-space: nowrap; }
.chip .ic { width: 15px; height: 15px; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.search { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; }
.search .ic { color: var(--fg3); }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 13px 0; outline: none; font-size: 16px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 34px 20px; color: var(--fg2); }
.empty .ic { width: 34px; height: 34px; color: var(--fg3); margin-bottom: 4px; }
.empty b { color: var(--fg); }

/* plan */
.phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.phase-pill { display: flex; flex-direction: column; padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.phase-pill b { font-size: 13.5px; }
.phase-pill span { font-size: 12px; color: var(--fg3); }
.phase-pill.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
.phase-desc { font-size: 13.5px; }
.weeks { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-block: 2px 4px; }
.weeks::-webkit-scrollbar { display: none; }
.wk { flex: none; width: 46px; height: 54px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.wk b { font: 700 16px/1 var(--f-display); }
.wk i { width: 26px; height: 4px; border-radius: 3px; background: linear-gradient(90deg, var(--good) var(--p), var(--track) var(--p)); }
.wk.now { border-color: var(--fg3); }
.wk.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.days { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.day { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden; }
.day::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c, var(--z1)); }
.day.rest { background: transparent; border-style: dashed; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.dd { display: flex; flex-direction: column; align-items: center; width: 40px; flex: none; }
.dd b { font: 700 13px var(--f-display); }
.dd span { font-size: 12px; color: var(--fg3); }
.dbody { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.dn { font-weight: 600; line-height: 1.3; }
.dm { font-size: 12.5px; }
.dst { color: var(--fg3); flex: none; }
.dst em { font-style: normal; font-size: 12px; color: var(--bad); }
.day.done .dst { color: var(--good); }
.day.done .dn { color: var(--fg2); }

/* liste */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.list > li + li { border-top: 1px solid var(--line); }
.li { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.lib { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lib b { font-weight: 600; line-height: 1.3; }
.lib .muted { font-size: 12.5px; }
.lik { display: flex; flex-direction: column; align-items: flex-end; font-weight: 700; line-height: 1.1; }
.lik small, .fm small { font-size: 10.5px; color: var(--fg3); font-weight: 500; }
.fm { display: flex; flex-direction: column; align-items: flex-end; width: 46px; line-height: 1.15; }
.exic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; --cc: var(--z1); color: var(--cc); background: color-mix(in srgb, var(--cc) 15%, transparent); }
.exic .ic { width: 19px; height: 19px; }
[data-c="kardio"] { --cc: var(--z5); } [data-c="zagrevanje"] { --cc: var(--z3); } [data-c="izdrzljivost"] { --cc: var(--z2); }
[data-c="snaga"] { --cc: var(--z4); } [data-c="core"] { --cc: var(--accent2); } [data-c="istezanje"] { --cc: var(--z1); }
.grp { font: 700 13px var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--fg3); margin: 8px 2px -4px; }
.okdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.ok1, .legend .ok1 { background: var(--good); }
.ok2, .legend .ok2 { background: var(--z3); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--fg2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.swaps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.swaps .card { gap: 6px; padding: 12px 14px; }
.sw { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; font-size: 14px; }
.sw .ic { width: 16px; height: 16px; color: var(--fg3); }
.sw .no { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.sw .yes { color: var(--good); }
.swaps p { font-size: 13px; }
.shop .li.got b { color: var(--fg3); text-decoration: line-through; }
.qty { font-weight: 600; color: var(--fg2); }

/* zone pulsa */
.zones { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.zseg { display: flex; flex-direction: column; align-items: center; padding: 8px 2px; border-radius: 10px; background: color-mix(in srgb, var(--c) 12%, transparent); opacity: .55; }
.zseg.on { opacity: 1; background: var(--c); color: #fff; }
.zn { font: 700 12px var(--f-display); }
.zb { font-size: 10.5px; font-variant-numeric: tabular-nums; }
.zcap { font-size: 13px; color: var(--fg2); }
.zlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.zlist li { display: grid; grid-template-columns: 12px 64px 1fr auto; align-items: center; gap: 10px; font-size: 14px; }
.zdot { width: 12px; height: 12px; border-radius: 4px; background: var(--c); }
.zlist span:nth-child(3) { color: var(--fg2); }
.tip summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.tip summary::-webkit-details-marker { display: none; }
.tip summary > .ic:first-child { color: var(--accent); }
.tip summary b { flex: 1; }
.tip .chev { color: var(--fg3); transition: transform .2s; }
.tip[open] .chev { transform: rotate(90deg); }

/* ishrana */
.datebar { display: flex; align-items: center; gap: 10px; }
.datebar > div { flex: 1; text-align: center; display: flex; flex-direction: column; }
.datebar .muted { font-size: 12.5px; }
.iconbtn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); flex: none; }
.iconbtn.sm { width: 36px; height: 36px; border-radius: 11px; }
.iconbtn.sm .ic { width: 17px; height: 17px; }
.iconbtn.on { color: var(--accent); }
.chkb.on { background: var(--good); border-color: var(--good); color: #fff; }
.kc-top { display: flex; align-items: center; gap: 16px; }
.kc-side { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kc-side .muted { font-size: 13px; }
.mbar { display: flex; flex-direction: column; gap: 5px; }
